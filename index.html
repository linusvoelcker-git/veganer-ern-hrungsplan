  .tp-ing .amt{ font-family:'IBM Plex Mono', monospace; font-weight:600; color:var(--rust); white-space:nowrap; }

  .tp-steps summary{ cursor:pointer; font-size:12.5px; color:var(--gold); font-weight:600; font-family:'IBM Plex Mono', monospace; }

  .tp-progress span{ width:26px; height:4px; border-radius:2px; background: rgba(255,255,255,.15); }
  .tp-progress span.done{ background: var(--gold); }
  .tp-progress span.today{ background: var(--rust); }

  .tp-archive-btn{

  .tp-archive-range{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--ink-soft); }
</style>

  function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }

  function renderIngredients(list){
    const ul = el("ul","tp-ing");
    list.forEach(([name, amt])=>{ const li = el("li"); li.innerHTML = `<span>${name}</span><span class="amt">${amt}</span>`; ul.appendChild(li); });
    return ul;
  }

  function renderMeal(slot, meal){
    const wrap = el("div","tp-meal");
    const head = el("div","tp-meal-head");
    head.innerHTML = `<div><div class="tp-slot">${slot}</div><div class="tp-dish">${meal.dish}</div></div><div class="tp-macros">${meal.macros}</div>`;
    wrap.appendChild(head);
    wrap.appendChild(renderIngredients(meal.ing));
    const details = el("details","tp-steps");
    details.appendChild(el("summary", null, "Zubereitung anzeigen"));
    const ol = el("ol");
    meal.steps.forEach(s=>{ ol.appendChild(el("li",null,s)); });
    details.appendChild(ol);
    wrap.appendChild(details);
    return wrap;
  }

  

  function renderProgress(daysArr, activeIdx, liveIdx, onPick){
    const wrap = el("div","tp-progress");
    daysArr.forEach((d,i)=>{
      const s = el("span");
      if(liveIdx !== null && i < liveIdx) s.classList.add("done");
      if(liveIdx !== null && i === liveIdx) s.classList.add("today");
      if(i === activeIdx) s.classList.add("viewing");
      s.setAttribute("role","button");
      s.setAttribute("tabindex","0");
      s.setAttribute("aria-label", d.name);
      s.addEventListener("click", ()=> onPick(i));
      s.addEventListener("keydown", (e)=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); onPick(i); } });
      wrap.appendChild(s);
    });
    return wrap;
  }

  function renderNav(activeIdx, onPrev, onNext, todayBtnCfg){
    const nav = el("div","tp-nav");
    const prevBtn = el("button","tp-nav-btn","‹ Zurück");
    prevBtn.disabled = activeIdx <= 0;
    prevBtn.addEventListener("click", onPrev);
    nav.appendChild(prevBtn);
    if(todayBtnCfg){
      const todayBtn = el("button","tp-nav-btn tp-nav-today","Heute");
      todayBtn.style.visibility = todayBtnCfg.visible ? "visible" : "hidden";
      todayBtn.addEventListener("click", todayBtnCfg.fn);
      nav.appendChild(todayBtn);
    }
    const nextBtn = el("button","tp-nav-btn","Weiter ›");
    nextBtn.disabled = activeIdx >= 6;
    nextBtn.addEventListener("click", onNext);
    nav.appendChild(nextBtn);
    return nav;
  }

  function renderAlerts(day){
    if(day.nextDayPrep){
      const a = el("div","tp-alert");
      a.innerHTML = `<span class="tp-alert-icon">⏰</span><span><b>Für morgen vorbereiten:</b> ${day.nextDayPrep.dish}. ${day.nextDayPrep.note}</span>`;
      root.appendChild(a);
    }
    if(day.selenNote){
      root.appendChild(el("div","tp-note","🌰 Heute ist ein Paranuss-Tag: 2-3 Stück als Snack für den Selenbedarf (nicht öfter, sonst überdosiert)."));
    }
  }

  function renderTicket(day, macroLine){
    const ticket = el("div","tp-ticket");
    ["Früh","Mittag","Abend"].forEach(slot=>{
      if(day.meals[slot]) ticket.appendChild(renderMeal(slot, day.meals[slot]));
    });
    const totalRow = el("div","tp-total");
    totalRow.innerHTML = `<span>${macroLine}</span><b>${day.dayTotal}</b>`;
    ticket.appendChild(totalRow);
    return ticket;
  }

  // ---------- state ----------
  let mode = "current"; // "current" | "archiveList" | "archiveWeek"
  let currentViewIndex = (todayIdx !== null) ? todayIdx : Math.min(Math.max(dayIndex,0),6);
  let archiveWeekIdx = null;
  let archiveViewIndex = 0;

  function renderCurrent(){
    root.innerHTML = "";
    const day = days[currentViewIndex];
    const dayDate = parseLocalDate(day.date);

    const header = el("div","tp-header");
    header.innerHTML = `<p class="tp-eyebrow">Woche ${CURRENT_WEEK} · Tag ${currentViewIndex+1} von 7</p><h1 class="tp-date">${weekdayLabel(dayDate)}</h1>`;
    root.appendChild(header);

    const topBar = el("div","tp-topbar");
    const archiveBtn = el("button","tp-archive-btn","📚 Archiv");
    archiveBtn.addEventListener("click", ()=>{ mode="archiveList"; render(); });
    topBar.appendChild(archiveBtn);
    root.appendChild(topBar);

    root.appendChild(renderNav(currentViewIndex,
      ()=>{ if(currentViewIndex>0){ currentViewIndex--; render(); } },
      ()=>{ if(currentViewIndex<6){ currentViewIndex++; render(); } },
      { visible: todayIdx !== null && currentViewIndex !== todayIdx, fn: ()=>{ currentViewIndex = todayIdx; render(); } }
    ));

    root.appendChild(renderProgress(days, currentViewIndex, todayIdx, (i)=>{ currentViewIndex=i; render(); }));

    renderAlerts(day);
    root.appendChild(renderTicket(day, "Tagesziel ≈ 2.250 kcal / 150g P / 165g F / ~31-39g KH"));

    let liveNote = "";
    if(todayIdx !== null && currentViewIndex === todayIdx){
      liveNote = " · Aktualisiert sich automatisch anhand des heutigen Datums";
    } else if(todayIdx === null){
      liveNote = (dayIndex < 0) ? ` · Startet am ${fmtShort(startDate)}` : ` · Woche ${CURRENT_WEEK} ist abgeschlossen`;
    }
    root.appendChild(el("div","tp-footer", `Woche ${CURRENT_WEEK} · ${fmtShort(startDate)}.–${fmtShort(addDays(startDate,6))}.2026 · Jodiertes Salz für alle Rezepte verwenden (Jod-Lücke)${liveNote}`));
  }

  function renderArchiveList(){
    root.innerHTML = "";
    const header = el("div","tp-header");
    header.innerHTML = `<p class="tp-eyebrow">Archiv</p><h1 class="tp-date">Vergangene Wochen</h1><p class="tp-sub">${ARCHIVE.length} Woche${ARCHIVE.length===1?"":"n"} gespeichert</p>`;
    root.appendChild(header);

    const topBar = el("div","tp-topbar");
    const backBtn = el("button","tp-archive-btn","‹ Zurück zu heute");
    backBtn.addEventListener("click", ()=>{ mode="current"; render(); });
    topBar.appendChild(backBtn);
    root.appendChild(topBar);

    const list = el("div","tp-archive-list");
    ARCHIVE.slice().reverse().forEach(w=>{
      const start = parseLocalDate(w.planStart);
      const end = addDays(start,6);
      const item = el("button","tp-archive-item");
      item.innerHTML = `<span class="tp-archive-week">Woche ${w.week}</span><span class="tp-archive-range">${fmtShort(start)}.–${fmtShort(end)}.2026</span>`;
      item.addEventListener("click", ()=>{
        archiveWeekIdx = ARCHIVE.indexOf(w);
        archiveViewIndex = 0;
        mode = "archiveWeek";
        render();
      });
      list.appendChild(item);
    });
    root.appendChild(list);
  }

  function renderArchiveWeek(){
    root.innerHTML = "";
    const w = ARCHIVE[archiveWeekIdx];
    const day = w.days[archiveViewIndex];
    const dayDate = parseLocalDate(day.date);

    const header = el("div","tp-header");
    header.innerHTML = `<p class="tp-eyebrow">Archiv · Woche ${w.week} · Tag ${archiveViewIndex+1} von 7</p><h1 class="tp-date">${weekdayLabel(dayDate)}</h1>`;
    root.appendChild(header);

    const topBar = el("div","tp-topbar");
    const listBtn = el("button","tp-archive-btn","📚 Alle Wochen");
    listBtn.addEventListener("click", ()=>{ mode="archiveList"; render(); });
    const homeBtn = el("button","tp-archive-btn","🏠 Heute");
    homeBtn.addEventListener("click", ()=>{ mode="current"; render(); });
    topBar.appendChild(listBtn);
    topBar.appendChild(homeBtn);
    root.appendChild(topBar);

    root.appendChild(renderNav(archiveViewIndex,
      ()=>{ if(archiveViewIndex>0){ archiveViewIndex--; render(); } },
      ()=>{ if(archiveViewIndex<6){ archiveViewIndex++; render(); } },
      null
    ));

    root.appendChild(renderProgress(w.days, archiveViewIndex, null, (i)=>{ archiveViewIndex=i; render(); }));

    renderAlerts(day);
    root.appendChild(renderTicket(day, "Tagesziel ≈ 2.250 kcal / 150g P / 165g F / ~30-39g KH"));

    const start = parseLocalDate(w.planStart);
    root.appendChild(el("div","tp-footer", `Archiv · Woche ${w.week} · ${fmtShort(start)}.–${fmtShort(addDays(start,6))}.2026`));
  }

  function render(){
    if(mode === "current") renderCurrent();
    else if(mode === "archiveList") renderArchiveList();
    else renderArchiveWeek();
  }

  render();
})();
</script>
</body>
</html>
