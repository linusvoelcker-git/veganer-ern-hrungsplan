  function renderIngredients(list){
    const ul = el("ul","tp-ing");
    list.forEach(([name, amt])=>{ const li = el("li"); li.innerHTML = `<span>${name}</span><span class="amt">${amt}</span>`; ul.appendChild(li); });
    return ul;
  }

  function renderMeal(slot, meal){
    const wrap = el("div","tp-meal");
    const head = el("div","tp-meal-head");
    head.innerHTML = `<div><div class="tp-slot">${slot}</div><div class="tp-dish">${meal.dish}</div></div><div class="tp-macros">${meal.macros}</div>`;
    wrap.appendChild(head);
    wrap.appendChild(renderIngredients(meal.ing));
    const details = el("details","tp-steps");
    details.appendChild(el("summary", null, "Zubereitung anzeigen"));
    const ol = el("ol");
    meal.steps.forEach(s=>{ ol.appendChild(el("li",null,s)); });
    details.appendChild(ol);
    wrap.appendChild(details);
    return wrap;
  }

  function renderProgress(idx, total){
    const wrap = el("div","tp-progress");
    for(let i=0;i<total;i++){
      const s = el("span");
      if(i < idx) s.classList.add("done");
      if(i === idx) s.classList.add("today");
      wrap.appendChild(s);
    }
    return wrap;
  }

  function weekdayLabel(d){ return d.toLocaleDateString("de-DE",{weekday:"long", day:"2-digit", month:"2-digit"}); }

  if(dayIndex < 0){
    root.appendChild(el("div","tp-header", `<p class="tp-eyebrow">Rest-Woche + Woche 11</p><h1 class="tp-date">Plan startet Donnerstag, 03.09.2026</h1><p class="tp-sub">Schau am Starttag wieder vorbei.</p>`));
    return;
  }
  if(dayIndex > days.length - 1){
    root.appendChild(el("div","tp-header", `<p class="tp-eyebrow">Rest-Woche + Woche 11</p><h1 class="tp-date">Dieser Zeitraum ist abgeschlossen</h1><p class="tp-sub">Sag Bescheid, sobald Woche 12 steht — dann bekommt dieses Tool das Update.</p>`));
    return;
  }

  const day = days[dayIndex];

  const header = el("div","tp-header");
  header.innerHTML = `<p class="tp-eyebrow">${day.period} · Tag ${dayIndex+1} von ${days.length}</p><h1 class="tp-date">${weekdayLabel(today)}</h1>`;
  root.appendChild(header);
  root.appendChild(renderProgress(dayIndex, days.length));

  if(day.nextDayPrep){
    const a = el("div","tp-alert");
    a.innerHTML = `<span class="tp-alert-icon">⏰</span><span><b>Für morgen vorbereiten:</b> ${day.nextDayPrep.dish}. ${day.nextDayPrep.note}</span>`;
    root.appendChild(a);
  }
  if(selenDays.includes(day.date)){
    root.appendChild(el("div","tp-note","🌰 Heute ist ein Paranuss-Tag: 2-3 Stück als Snack für den Selenbedarf (nicht öfter, sonst überdosiert)."));
  }
  if(dayIndex === 0 || dayIndex === 4){
    root.appendChild(el("div","tp-note","⚠ Neuer Einkauf für diesen Abschnitt: Rucola/Spinat/Champignons sind bewusst auf die ersten Tage gelegt — frisch kaufen, nicht auf Vorrat."));
  }

  const ticket = el("div","tp-ticket");
  ["Früh","Mittag","Abend"].forEach(slot=>{
    if(day.meals[slot]) ticket.appendChild(renderMeal(slot, day.meals[slot]));
  });
  const totalRow = el("div","tp-total");
  totalRow.innerHTML = `<span>Tagesziel ≈ 2.250 kcal / 150g P / 165g F / ~29-38g KH</span><b>${day.dayTotal}</b>`;
  ticket.appendChild(totalRow);
  root.appendChild(ticket);

  root.appendChild(el("div","tp-footer",`Aktualisiert sich automatisch anhand des heutigen Datums · 03.09.–13.09.2026 · Jodiertes Salz verwenden`));
})();
</script>
