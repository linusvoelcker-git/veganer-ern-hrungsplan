<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veganer Ernährungsplan – Woche 7</title>
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg: #16241f; --bg-alt: #1c2f28; --card: #f3efe4; --card-line: #d9d1bb;
    --ink: #1c2b24; --ink-soft: #55665c; --cream: #f3efe4; --sage: #93a89a;
    --gold: #c79a2b; --rust: #a8543a; --rust-bg: #3a231d;
  }
  *{box-sizing:border-box;}
  .tp-root{ background: radial-gradient(ellipse at top, var(--bg-alt) 0%, var(--bg) 60%); color: var(--cream);
    font-family:'IBM Plex Sans', sans-serif; min-height: 100%; padding: 28px 16px 48px;
    display:flex; flex-direction:column; align-items:center; gap:20px; }
  .tp-header{ text-align:center; max-width:640px; }
  .tp-eyebrow{ font-family:'IBM Plex Mono', monospace; letter-spacing:.18em; text-transform:uppercase;
    font-size:11px; color: var(--sage); margin-bottom:6px; }
  .tp-date{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(26px,5vw,38px); line-height:1.1; margin:0; }
  .tp-sub{ color: var(--sage); font-size:13px; margin-top:6px; }
  .tp-alert{ max-width:560px; width:100%; background: var(--rust-bg); border:1px solid var(--rust);
    border-radius:10px; padding:14px 16px; font-size:13.5px; line-height:1.5; color:#f2e2da;
    display:flex; gap:10px; align-items:flex-start; }
  .tp-alert b{ color:#fff; } .tp-alert .tp-alert-icon{ font-size:18px; line-height:1.3; }
  .tp-ticket{ width:100%; max-width:560px; background: var(--card); color: var(--ink);
    border-radius: 14px; box-shadow: 0 18px 40px rgba(0,0,0,.35); overflow:hidden; position:relative; }
  .tp-ticket::before{ content:""; position:absolute; top:0; left:0; right:0; height:10px;
    background-image: radial-gradient(circle at 10px 0, transparent 5px, var(--bg) 5px);
    background-size: 20px 10px; background-repeat: repeat-x; }
  .tp-meal{ padding: 22px 22px 18px; border-bottom: 1px dashed var(--card-line); }
  .tp-meal:last-child{ border-bottom:none; }
  .tp-meal-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px;}
  .tp-slot{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color: var(--ink-soft); }
  .tp-dish{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; margin:2px 0 0; }
  .tp-macros{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); white-space:nowrap; }
  .tp-ing{ list-style:none; margin:10px 0 4px; padding:0; display:grid; grid-template-columns: 1fr; gap:5px; }
  .tp-ing li{ display:flex; justify-content:space-between; gap:12px; font-size:14px;
    border-bottom:1px dotted var(--card-line); padding-bottom:5px; }
  .tp-ing .amt{ font-family:'IBM Plex Mono', monospace; font-weight:600; color:var(--rust); white-space:nowrap; }
  .tp-steps{ margin-top:12px; }
  .tp-steps summary{ cursor:pointer; font-size:12.5px; color:var(--gold); font-weight:600; font-family:'IBM Plex Mono', monospace; }
  .tp-steps ol{ margin:10px 0 0; padding-left:18px; font-size:13.5px; line-height:1.55; color:var(--ink); }
  .tp-steps li{ margin-bottom:6px; }
  .tp-total{ padding:16px 22px 20px; display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .tp-total b{ color:var(--ink); font-size:14px; }
  .tp-footer{ max-width:560px; text-align:center; font-size:11.5px; color:var(--sage);
    font-family:'IBM Plex Mono', monospace; line-height:1.6; margin-top:4px; }
  .tp-progress{ display:flex; gap:6px; margin: 4px 0 2px; }
  .tp-progress span{ width:26px; height:4px; border-radius:2px; background: rgba(255,255,255,.15); }
  .tp-progress span.done{ background: var(--gold); }
  .tp-progress span.today{ background: var(--rust); }
</style>

<div class="tp-root" id="tp-root"></div>

<script>

          steps:["Chiasamen mit Kokosmilch und Kokosöl verrühren, 5 Min. quellen lassen, nochmal umrühren.","Proteinpulver und etwas Vanille einrühren, glattrühren.","Mind. 2h (am besten über Nacht) im Kühlschrank quellen lassen.","Mit gehackten Mandeln toppen."]},
        "Mittag": {dish:"Tofu-Brokkoli-Pfanne mit Sesam-Sauce",

        "Abend": {dish:"Seitan-Paprika-Auflauf mit Kokos-Kruste",

          macros:"P 95g · F 33g · KH 12g · 728 kcal",
          steps:["Backofen auf 190°C vorheizen. Seitan und Paprika würfeln.","In einer Auflaufform verteilen, mit Öl beträufeln.","Mit Hefeflocken bestreuen.","20-25 Min. backen bis leicht gebräunt."]},
      }, dayTotal:"P 175g · F 142g · KH 32g · 2.106 kcal"
    },
    { name:"Dienstag", date:"2026-08-11", meals:{

          ing:[["Tofu (fest/natur)","250 g"],["Spinat","60 g"],["Hefeflocken","10 g"],["Olivenöl","25 ml"]],

          steps:["Tofu mit Hefeflocken und etwas Wasser im Mixer cremig pürieren, würzen.","Olivenöl erhitzen, Spinat kurz zusammenfallen lassen.","Tofu-Masse dazugeben, bei mittlerer Hitze 8-10 Min. stocken lassen."]},

        "Abend": {dish:"Gebackener Tofu mit Champignon-Sahne & Rucola",

      }, dayTotal:"P 120g · F 147g · KH 33g · 1.936 kcal"
    },
    { name:"Mittwoch", date:"2026-08-12", meals:{
        "Früh": {dish:"Beeren-Kokos-Proteinshake",

          steps:["Alle Zutaten in den Mixer geben.","Glatt cremig mixen (30-45 Sek.), bei Bedarf Wasser/Eis dazugeben."]},
        "Mittag": {dish:"Seitan-Gemüse-Spieße mediterran",
          ing:[["Seitan","120 g"],["Zucchini","120 g"],["Paprika","40 g"],["Olivenöl","35 ml"]],

          steps:["Tofu würfeln, in etwas Öl anbraten.","Blumenkohl in Röschen dazugeben, kurz mitbraten.","Kokosmilch und Currypulver dazugeben, 8-10 Min. köcheln lassen."]},
      }, dayTotal:"P 166g · F 143g · KH 31g · 2.076 kcal"
    },
    { name:"Donnerstag", date:"2026-08-13", meals:{
        "Früh": {dish:"Avocado-Schoko-Chiapudding",

          steps:["Avocado, Kakaopulver, Proteinpulver und Kokosmilch im Mixer glatt pürieren.","In eine Schale füllen, mit Chiasamen bestreuen.","15-20 Min. kühl stellen (optional)."]},

        "Abend": {dish:"Seitan-Champignon-Auflauf",
          ing:[["Seitan","120 g"],["Champignons","120 g"],["Hefeflocken","10 g"],["Olivenöl","35 ml"]],
          macros:"P 99g · F 38g · KH 13g · 793 kcal",
          steps:["Backofen auf 190°C vorheizen. Seitan würfeln, Champignons in Scheiben.","In einer Auflaufform verteilen, mit Öl beträufeln, Hefeflocken bestreuen.","20-25 Min. backen bis leicht gebräunt."]},
      }, dayTotal:"P 168g · F 134g · KH 38g · 2.033 kcal"
    },
    { name:"Freitag", date:"2026-08-14", meals:{
        "Früh": {dish:"Tofu-Gemüse-Rührei mit Kräutern",
          ing:[["Tofu (fest/natur)","250 g"],["Zucchini","100 g"],["Spinat","50 g"],["Olivenöl","30 ml"]],
          macros:"P 41g · F 50g · KH 8g · 651 kcal",
          steps:["Tofu grob zerbröseln, Zucchini würfeln.","Olivenöl erhitzen, Zucchini 3-4 Min. andünsten.","Tofu dazugeben, mit Kräutern und Salz würzen, 5-6 Min. braten.","Spinat zum Schluss unterheben."]},
        "Mittag": {dish:"Tofu-Auberginen-Bowl mit Tahin-Sauce",
          ing:[["Tofu (fest/natur)","220 g"],["Aubergine","150 g"],["Tahini","20 g"],["Olivenöl","25 ml"]],
          macros:"P 39g · F 54g · KH 13g · 690 kcal",
          steps:["Tofu würfeln, in etwas Öl anbraten.","Aubergine in Stücke schneiden, dazugeben, 8-10 Min. weich braten.","Tahini mit Wasser und Zitronensaft glattrühren, über die Bowl geben."]},
        "Abend": {dish:"Seitan-Wok mit Paprika und Sesam",
          ing:[["Seitan","120 g"],["Paprika","50 g"],["Sesam","15 g"],["Sojasauce","10 ml"],["Olivenöl","30 ml"]],
          macros:"P 94g · F 40g · KH 13g · 788 kcal",
          steps:["Seitan in Streifen schneiden, Paprika in Streifen.","In Olivenöl scharf anbraten, Paprika dazugeben, 6-8 Min. mitbraten.","Mit Sojasauce ablöschen, mit Sesam bestreuen."]},
      }, dayTotal:"P 174g · F 144g · KH 33g · 2.129 kcal",
      nextDayPrep:{ dish:"Schoko-Mandel-Chiapudding (Samstag-Frühstück)",
        note:"Chiasamen mit Kakaopulver, Kokosmilch und Kokosöl verrühren, Proteinpulver einrühren – heute Abend im Kühlschrank quellen lassen (über Nacht)." }
    },
    { name:"Samstag", date:"2026-08-15", meals:{
        "Früh": {dish:"Schoko-Mandel-Chiapudding",
          ing:[["Chiasamen","25 g"],["Kakaopulver","10 g"],["Mandeln","20 g"],["Kokosmilch (Dose)","80 ml"],["Kokosöl","10 ml"],["Veganes Proteinpulver","30 g"]],
          macros:"P 36g · F 50g · KH 9g · 629 kcal",
          steps:["(Gestern Abend vorbereitet) Aus dem Kühlschrank nehmen.","Mit gehackten Mandeln bestreuen."]},
        "Mittag": {dish:"Tempeh-Gemüse-Curry grün",
          ing:[["Tempeh","150 g"],["Brokkoli","100 g"],["Zucchini","100 g"],["Kokosmilch (Dose)","80 ml"],["Olivenöl","15 ml"]],
          macros:"P 36g · F 51g · KH 19g · 682 kcal",

        "Abend": {dish:"Tofu-Steak mit Avocado-Salsa",
          ing:[["Tofu (fest/natur)","250 g"],["Avocado","100 g"],["Gurke","80 g"],["Tomaten","40 g"],["Olivenöl","20 ml"]],
          macros:"P 42g · F 55g · KH 10g · 705 kcal",
          steps:["Tofu in dicke Scheiben schneiden, in etwas Öl kräftig anbraten.","Avocado, Gurke und Tomaten würfeln, mit Limette und Salz zur Salsa vermengen.","Tofu-Steak mit Salsa servieren."]},
      }, dayTotal:"P 114g · F 156g · KH 38g · 2.016 kcal"
    },
    { name:"Sonntag", date:"2026-08-16", meals:{
        "Früh": {dish:"Beeren-Protein-Kokosjoghurt",
          ing:[["Kokosjoghurt (ungesüßt)","150 g"],["Himbeeren","20 g"],["Chiasamen","15 g"],["Veganes Proteinpulver","25 g"],["Mandeln","25 g"]],
          macros:"P 31g · F 40g · KH 11g · 525 kcal",
          steps:["Kokosjoghurt mit Proteinpulver glattrühren.","Chiasamen einrühren, 10 Min. quellen lassen.","Mit Himbeeren und gehackten Mandeln toppen."]},
        "Mittag": {dish:"Tofu-Gemüse-Wok asiatisch",
          ing:[["Tofu (fest/natur)","250 g"],["Zucchini","120 g"],["Paprika","40 g"],["Sesam","15 g"],["Sojasauce","10 ml"],["Olivenöl","30 ml"]],
          macros:"P 44g · F 58g · KH 10g · 739 kcal",
          steps:["Tofu würfeln, Zucchini und Paprika in Streifen schneiden.","Olivenöl erhitzen, Tofu knusprig anbraten (5-6 Min.).","Gemüse dazugeben, 5-6 Min. bei hoher Hitze mitbraten.","Mit Sojasauce ablöschen, mit Sesam bestreuen."]},
        "Abend": {dish:"Seitan-Rotes-Curry mit Blumenkohlreis",
          ing:[["Seitan","120 g"],["Kokosmilch (Dose)","80 ml"],["Blumenkohl","130 g"],["Paprika","30 g"],["Olivenöl","30 ml"]],
          macros:"P 95g · F 52g · KH 17g · 916 kcal",
          steps:["Seitan würfeln, Paprika in Streifen.","In etwas Öl anbraten, Paprika dazugeben, 5-6 Min. mitbraten.","Kokosmilch dazugeben, mit Currypaste/Chili würzen, 8-10 Min. köcheln lassen.","Blumenkohl fein raspeln, roh oder kurz gedünstet als 'Reis' dazu servieren."]},
      }, dayTotal:"P 170g · F 150g · KH 39g · 2.180 kcal"
    },
  ];

  function parseLocalDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
  function todayLocal(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  const root = document.getElementById("tp-root");
  const today = todayLocal();
  const startDate = parseLocalDate(PLAN_START);
  const dayIndex = Math.round((today - startDate) / 86400000);

  function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }

  function renderIngredients(list){
    const ul = el("ul","tp-ing");
    list.forEach(([name, amt])=>{ const li = el("li"); li.innerHTML = `<span>${name}</span><span class="amt">${amt}</span>`; ul.appendChild(li); });
    return ul;
  }

  function renderMeal(slot, meal){
    const wrap = el("div","tp-meal");
    const head = el("div","tp-meal-head");
    head.innerHTML = `<div><div class="tp-slot">${slot}</div><div class="tp-dish">${meal.dish}</div></div><div class="tp-macros">${meal.macros}</div>`;
    wrap.appendChild(head);
    wrap.appendChild(renderIngredients(meal.ing));
    const details = el("details","tp-steps");
    details.appendChild(el("summary", null, "Zubereitung anzeigen"));
    const ol = el("ol");
    meal.steps.forEach(s=>{ ol.appendChild(el("li",null,s)); });
    details.appendChild(ol);
    wrap.appendChild(details);
    return wrap;
  }

  function renderProgress(idx){
    const wrap = el("div","tp-progress");
    for(let i=0;i<7;i++){
      const s = el("span");
      if(i < idx) s.classList.add("done");
      if(i === idx) s.classList.add("today");
      wrap.appendChild(s);
    }
    return wrap;
  }

  function weekdayLabel(d){ return d.toLocaleDateString("de-DE",{weekday:"long", day:"2-digit", month:"2-digit"}); }

  if(dayIndex < 0){
    root.appendChild(el("div","tp-header", `<p class="tp-eyebrow">Woche 7</p><h1 class="tp-date">Plan startet Montag, 10.08.2026</h1><p class="tp-sub">Schau am Starttag wieder vorbei.</p>`));
    return;
  }
  if(dayIndex > 6){
    root.appendChild(el("div","tp-header", `<p class="tp-eyebrow">Woche 7</p><h1 class="tp-date">Woche 7 ist abgeschlossen</h1><p class="tp-sub">Sag Bescheid, sobald Woche 8 steht — dann bekommt dieses Tool das Update.</p>`));
    return;
  }

  const day = days[dayIndex];

  const header = el("div","tp-header");
  header.innerHTML = `<p class="tp-eyebrow">Woche 7 · Tag ${dayIndex+1} von 7</p><h1 class="tp-date">${weekdayLabel(today)}</h1>`;
  root.appendChild(header);
  root.appendChild(renderProgress(dayIndex));

  if(day.nextDayPrep){
    const a = el("div","tp-alert");
    a.innerHTML = `<span class="tp-alert-icon">⏰</span><span><b>Für morgen vorbereiten:</b> ${day.nextDayPrep.dish}. ${day.nextDayPrep.note}</span>`;
    root.appendChild(a);
  }

  const ticket = el("div","tp-ticket");
  ["Früh","Mittag","Abend"].forEach(slot=>{
    if(day.meals[slot]) ticket.appendChild(renderMeal(slot, day.meals[slot]));
  });
  const totalRow = el("div","tp-total");
  totalRow.innerHTML = `<span>Tagesziel ≈ 2.250 kcal / 150g P / 165g F / ~31-39g KH</span><b>${day.dayTotal}</b>`;
  ticket.appendChild(totalRow);
  root.appendChild(ticket);

  root.appendChild(el("div","tp-footer","Aktualisiert sich automatisch anhand des heutigen Datums · Woche 7 · 10.08.–16.08.2026"));
})();
</script>
</body>
</html>
