<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veganer Ernährungsplan – Woche 8</title>
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg: #16241f; --bg-alt: #1c2f28; --card: #f3efe4; --card-line: #d9d1bb;
    --ink: #1c2b24; --ink-soft: #55665c; --cream: #f3efe4; --sage: #93a89a;
    --gold: #c79a2b; --rust: #a8543a; --rust-bg: #3a231d;
  }
  *{box-sizing:border-box;}
  .tp-root{ background: radial-gradient(ellipse at top, var(--bg-alt) 0%, var(--bg) 60%); color: var(--cream);
    font-family:'IBM Plex Sans', sans-serif; min-height: 100%; padding: 28px 16px 48px;
    display:flex; flex-direction:column; align-items:center; gap:20px; }
  .tp-header{ text-align:center; max-width:640px; }
  .tp-eyebrow{ font-family:'IBM Plex Mono', monospace; letter-spacing:.18em; text-transform:uppercase;
    font-size:11px; color: var(--sage); margin-bottom:6px; }
  .tp-date{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(26px,5vw,38px); line-height:1.1; margin:0; }
  .tp-sub{ color: var(--sage); font-size:13px; margin-top:6px; }
  .tp-alert{ max-width:560px; width:100%; background: var(--rust-bg); border:1px solid var(--rust);
    border-radius:10px; padding:14px 16px; font-size:13.5px; line-height:1.5; color:#f2e2da;
    display:flex; gap:10px; align-items:flex-start; }
  .tp-alert b{ color:#fff; } .tp-alert .tp-alert-icon{ font-size:18px; line-height:1.3; }
  .tp-note{ max-width:560px; width:100%; background: #26332b; border:1px solid #3d5245;
    border-radius:10px; padding:12px 16px; font-size:12.5px; line-height:1.5; color:var(--sage); }
  .tp-ticket{ width:100%; max-width:560px; background: var(--card); color: var(--ink);
    border-radius: 14px; box-shadow: 0 18px 40px rgba(0,0,0,.35); overflow:hidden; position:relative; }
  .tp-ticket::before{ content:""; position:absolute; top:0; left:0; right:0; height:10px;
    background-image: radial-gradient(circle at 10px 0, transparent 5px, var(--bg) 5px);
    background-size: 20px 10px; background-repeat: repeat-x; }
  .tp-meal{ padding: 22px 22px 18px; border-bottom: 1px dashed var(--card-line); }
  .tp-meal:last-child{ border-bottom:none; }
  .tp-meal-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px;}
  .tp-slot{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color: var(--ink-soft); }
  .tp-dish{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; margin:2px 0 0; }
  .tp-macros{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); white-space:nowrap; }
  .tp-ing{ list-style:none; margin:10px 0 4px; padding:0; display:grid; grid-template-columns: 1fr; gap:5px; }
  .tp-ing li{ display:flex; justify-content:space-between; gap:12px; font-size:14px;
    border-bottom:1px dotted var(--card-line); padding-bottom:5px; }
  .tp-ing .amt{ font-family:'IBM Plex Mono', monospace; font-weight:600; color:var(--rust); white-space:nowrap; }
  .tp-steps{ margin-top:12px; }
  .tp-steps summary{ cursor:pointer; font-size:12.5px; color:var(--gold); font-weight:600; font-family:'IBM Plex Mono', monospace; }
  .tp-steps ol{ margin:10px 0 0; padding-left:18px; font-size:13.5px; line-height:1.55; color:var(--ink); }
  .tp-steps li{ margin-bottom:6px; }
  .tp-total{ padding:16px 22px 20px; display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .tp-total b{ color:var(--ink); font-size:14px; }
  .tp-footer{ max-width:560px; text-align:center; font-size:11.5px; color:var(--sage);
    font-family:'IBM Plex Mono', monospace; line-height:1.6; margin-top:4px; }
  .tp-progress{ display:flex; gap:6px; margin: 4px 0 2px; }
  .tp-progress span{ width:26px; height:4px; border-radius:2px; background: rgba(255,255,255,.15); }
  .tp-progress span.done{ background: var(--gold); }
  .tp-progress span.today{ background: var(--rust); }

  .tp-nav{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .tp-nav-btn{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.03em;
    background: transparent; border:1px solid rgba(255,255,255,.28); color: var(--cream);
    border-radius:999px; padding:6px 14px; cursor:pointer; transition: background .15s, opacity .15s;
  }
  .tp-nav-btn:hover:not(:disabled){ background: rgba(255,255,255,.1); }
  .tp-nav-btn:disabled{ opacity:.28; cursor:default; }
  .tp-nav-today{ color: var(--gold); border-color: var(--gold); }
  .tp-progress span{ cursor:pointer; }
  .tp-progress span.viewing{ outline:2px solid var(--cream); outline-offset:2px; }
</style>

<div class="tp-root" id="tp-root"></div>

<script>

        "Abend": {dish:"Seitan-Zucchini-Auflauf mit Kruste",

    { name:"Dienstag", date:"2026-08-18", meals:{

        "Abend": {dish:"Tofu-Gemüse-Curry grün mit Spinat",

      }, dayTotal:"P 120g · F 148g · KH 35g · 1.954 kcal"
    },
    { name:"Mittwoch", date:"2026-08-19", meals:{
        "Früh": {dish:"Mandel-Kokos-Protein-Smoothie",

          steps:["Backofen auf 190°C vorheizen. Aubergine in Scheiben, Tofu würfeln.","In einer Auflaufform schichten, gehackte Tomaten und Öl darüber, Hefeflocken bestreuen.","25-30 Min. backen bis die Aubergine weich ist."]},
      }, dayTotal:"P 169g · F 142g · KH 33g · 2.085 kcal",
      selenNote:true
    },
    { name:"Donnerstag", date:"2026-08-20", meals:{
        "Früh": {dish:"Beeren-Sonnenblumenkern-Chiapudding",

          steps:["Tempeh würfeln, in etwas vom Öl anbraten.","Rucola und Gurke anrichten, Tempeh darauf verteilen.","Sesam mit restlichem Öl und etwas Sojasauce zum Dressing verrühren."]},
        "Abend": {dish:"Seitan-Pilz-Ragout mit Blumenkohlpüree",
          ing:[["Seitan","120 g"],["Champignons","120 g"],["Blumenkohl","100 g"],["Olivenöl","40 ml"],["Kokosöl","10 ml"]],
          macros:"P 92g · F 45g · KH 12g · 789 kcal",
          steps:["Seitan würfeln, Champignons in Scheiben.","Olivenöl erhitzen, Seitan anbraten (5 Min.), Champignons dazugeben, 5-6 Min. mitbraten.","Blumenkohl weich dämpfen, mit Kokosöl fein pürieren, salzen.","Ragout auf dem Püree anrichten."]},
      }, dayTotal:"P 164g · F 136g · KH 39g · 2.034 kcal"
    },
    { name:"Freitag", date:"2026-08-21", meals:{
        "Früh": {dish:"Avocado-Beeren-Bowl mit Chiasamen",
          ing:[["Avocado","100 g"],["Himbeeren","25 g"],["Chiasamen","15 g"],["Veganes Proteinpulver","30 g"],["Kokosmilch (Dose)","40 ml"]],
          macros:"P 31g · F 27g · KH 8g · 386 kcal",
          steps:["Avocado mit Proteinpulver und Kokosmilch verrühren oder pürieren.","Mit Himbeeren und Chiasamen toppen."]},
        "Mittag": {dish:"Tofu-Zucchini-Curry gelb",
          ing:[["Tofu (fest/natur)","250 g"],["Zucchini","130 g"],["Kokosmilch (Dose)","80 ml"],["Olivenöl","35 ml"]],
          macros:"P 45g · F 63g · KH 11g · 799 kcal",
          steps:["Tofu würfeln, in etwas Öl anbraten.","Zucchini dazugeben, kurz mitbraten.","Kokosmilch und Kurkuma dazugeben, 8-10 Min. köcheln lassen."]},
        "Abend": {dish:"Seitan-Gemüse-Pfanne mit Erdnuss-Sauce",
          ing:[["Seitan","120 g"],["Paprika","40 g"],["Erdnussmus","20 g"],["Sojasauce","10 ml"],["Olivenöl","15 ml"]],
          macros:"P 92g · F 43g · KH 12g · 809 kcal",
          steps:["Seitan in Streifen schneiden, Paprika in Streifen.","In Olivenöl anbraten, Paprika dazugeben, 6-8 Min. mitbraten.","Erdnussmus mit Sojasauce und etwas Wasser glattrühren, über die Pfanne geben."]},
      }, dayTotal:"P 168g · F 133g · KH 31g · 1.994 kcal"
    },
    { name:"Samstag", date:"2026-08-22", meals:{
        "Früh": {dish:"Tofu-Spinat-Frühstückspfanne mit Champignons",
          ing:[["Tofu (fest/natur)","250 g"],["Spinat","60 g"],["Champignons","80 g"],["Olivenöl","20 ml"]],
          macros:"P 42g · F 42g · KH 8g · 610 kcal",
          steps:["Tofu grob zerbröseln, Champignons in Scheiben.","Olivenöl erhitzen, Champignons 3-4 Min. anbraten.","Tofu dazugeben, mit Kurkuma und Salz würzen, 5-6 Min. braten.","Spinat zum Schluss unterheben."]},
        "Mittag": {dish:"Tofu-Rucola-Salat mit gerösteten Mandeln",
          ing:[["Tofu (fest/natur)","220 g"],["Rucola","100 g"],["Gurke","100 g"],["Mandeln","25 g"],["Olivenöl","20 ml"]],
          macros:"P 43g · F 51g · KH 13g · 691 kcal",
          steps:["Mandeln in einer trockenen Pfanne kurz rösten.","Tofu würfeln, in etwas vom Öl knusprig anbraten.","Rucola und Gurke anrichten, Tofu darauf verteilen.","Mit gerösteten Mandeln bestreuen, mit Öl beträufeln."]},
        "Abend": {dish:"Tempeh-Paprika-Curry rot",
          ing:[["Tempeh","150 g"],["Paprika","50 g"],["Kokosmilch (Dose)","80 ml"],["Olivenöl","30 ml"]],
          macros:"P 32g · F 64g · KH 13g · 780 kcal",
          steps:["Tempeh würfeln, Paprika in Streifen.","Olivenöl erhitzen, Tempeh 5 Min. anbraten.","Paprika dazugeben, kurz mitbraten.","Kokosmilch dazugeben, 8-10 Min. köcheln lassen."]},
      }, dayTotal:"P 117g · F 157g · KH 34g · 2.014 kcal"
    },
    { name:"Sonntag", date:"2026-08-23", meals:{
        "Früh": {dish:"Schoko-Chia-Pudding mit Paranüssen",
          ing:[["Chiasamen","25 g"],["Kakaopulver","10 g"],["Kokosmilch (Dose)","80 ml"],["Kokosöl","10 ml"],["Veganes Proteinpulver","30 g"],["Paranüsse","2-3 Stk."]],
          macros:"P 32g · F 41g · KH 9g · 555 kcal",
          steps:["Chiasamen mit Kakaopulver, Kokosmilch und Kokosöl verrühren.","Proteinpulver einrühren, glattrühren.","Mind. 2h (am besten über Nacht) im Kühlschrank quellen lassen.","Mit 2-3 gehackten Paranüssen toppen (Selen)."]},
        "Mittag": {dish:"Tofu-Blumenkohl-Wok mit Sesam",
          ing:[["Tofu (fest/natur)","250 g"],["Blumenkohl","130 g"],["Sesam","15 g"],["Sojasauce","10 ml"],["Olivenöl","25 ml"]],
          macros:"P 47g · F 55g · KH 11g · 730 kcal",
          steps:["Tofu würfeln, Blumenkohl in kleine Röschen teilen.","Olivenöl erhitzen, Tofu knusprig anbraten (5-6 Min.).","Blumenkohl dazugeben, 5-6 Min. mitbraten.","Mit Sojasauce ablöschen, mit Sesam bestreuen."]},
        "Abend": {dish:"Seitan-Auberginen-Curry mit Kokosmilch",
          ing:[["Seitan","120 g"],["Aubergine","120 g"],["Kokosmilch (Dose)","80 ml"],["Olivenöl","35 ml"]],
          macros:"P 91g · F 54g · KH 14g · 875 kcal",
          steps:["Seitan würfeln, Aubergine in Stücke schneiden.","Olivenöl erhitzen, beides 6-8 Min. anbraten.","Kokosmilch dazugeben, 8-10 Min. köcheln lassen."]},
      }, dayTotal:"P 170g · F 150g · KH 34g · 2.161 kcal",
      selenNote:true
    },
  ];

  function parseLocalDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
  function todayLocal(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  const root = document.getElementById("tp-root");
  const today = todayLocal();
  const startDate = parseLocalDate(PLAN_START);
  const dayIndex = Math.round((today - startDate) / 86400000);

  function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }

  function renderIngredients(list){
    const ul = el("ul","tp-ing");
    list.forEach(([name, amt])=>{ const li = el("li"); li.innerHTML = `<span>${name}</span><span class="amt">${amt}</span>`; ul.appendChild(li); });
    return ul;
  }

  function renderMeal(slot, meal){
    const wrap = el("div","tp-meal");
    const head = el("div","tp-meal-head");
    head.innerHTML = `<div><div class="tp-slot">${slot}</div><div class="tp-dish">${meal.dish}</div></div><div class="tp-macros">${meal.macros}</div>`;
    wrap.appendChild(head);
    wrap.appendChild(renderIngredients(meal.ing));
    const details = el("details","tp-steps");
    details.appendChild(el("summary", null, "Zubereitung anzeigen"));
    const ol = el("ol");
    meal.steps.forEach(s=>{ ol.appendChild(el("li",null,s)); });
    details.appendChild(ol);
    wrap.appendChild(details);
    return wrap;
  }

  

  function renderProgress(idx, viewIdx){
    const wrap = el("div","tp-progress");
    for(let i=0;i<7;i++){
      const s = el("span");
      if(i < idx) s.classList.add("done");
      if(i === idx) s.classList.add("today");
      if(i === viewIdx) s.classList.add("viewing");
      s.setAttribute("role","button");
      s.setAttribute("tabindex","0");
      s.setAttribute("aria-label", days[i].name);
      s.addEventListener("click", ()=>{ viewIndex = i; render(); });
      s.addEventListener("keydown", (e)=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); viewIndex = i; render(); } });
      wrap.appendChild(s);
    }
    return wrap;
  }

  function weekdayLabel(d){ return d.toLocaleDateString("de-DE",{weekday:"long", day:"2-digit", month:"2-digit"}); }

  if(dayIndex < 0){
    root.appendChild(el("div","tp-header", `<p class="tp-eyebrow">Woche 8</p><h1 class="tp-date">Plan startet Montag, 17.08.2026</h1><p class="tp-sub">Schau am Starttag wieder vorbei.</p>`));
    return;
  }
  if(dayIndex > 6){
    root.appendChild(el("div","tp-header", `<p class="tp-eyebrow">Woche 8</p><h1 class="tp-date">Woche 8 ist abgeschlossen</h1><p class="tp-sub">Sag Bescheid, sobald Woche 9 steht — dann bekommt dieses Tool das Update.</p>`));
    return;
  }

  let viewIndex = dayIndex;

  function render(){
    root.innerHTML = "";
    const day = days[viewIndex];
    const dayDate = parseLocalDate(day.date);

    const header = el("div","tp-header");
    header.innerHTML = `<p class="tp-eyebrow">Woche 8 · Tag ${viewIndex+1} von 7</p><h1 class="tp-date">${weekdayLabel(dayDate)}</h1>`;
    root.appendChild(header);

    const nav = el("div","tp-nav");
    const prevBtn = el("button","tp-nav-btn", "‹ Zurück");
    prevBtn.disabled = viewIndex <= 0;
    prevBtn.addEventListener("click", ()=>{ if(viewIndex>0){ viewIndex--; render(); } });
    const todayBtn = el("button","tp-nav-btn tp-nav-today", "Heute");
    todayBtn.style.visibility = (viewIndex === dayIndex) ? "hidden" : "visible";
    todayBtn.addEventListener("click", ()=>{ viewIndex = dayIndex; render(); });
    const nextBtn = el("button","tp-nav-btn", "Weiter ›");
    nextBtn.disabled = viewIndex >= 6;
    nextBtn.addEventListener("click", ()=>{ if(viewIndex<6){ viewIndex++; render(); } });
    nav.appendChild(prevBtn);
    nav.appendChild(todayBtn);
    nav.appendChild(nextBtn);
    root.appendChild(nav);

    root.appendChild(renderProgress(dayIndex, viewIndex));

    if(day.nextDayPrep){
      const a = el("div","tp-alert");
      a.innerHTML = `<span class="tp-alert-icon">⏰</span><span><b>Für morgen vorbereiten:</b> ${day.nextDayPrep.dish}. ${day.nextDayPrep.note}</span>`;
      root.appendChild(a);
    }
    if(day.selenNote){
      root.appendChild(el("div","tp-note","🌰 Heute ist ein Paranuss-Tag: 2-3 Stück als Snack für den Selenbedarf (nicht öfter, sonst überdosiert)."));
    }

    const ticket = el("div","tp-ticket");
    ["Früh","Mittag","Abend"].forEach(slot=>{
      if(day.meals[slot]) ticket.appendChild(renderMeal(slot, day.meals[slot]));
    });
    const totalRow = el("div","tp-total");
    totalRow.innerHTML = `<span>Tagesziel ≈ 2.250 kcal / 150g P / 165g F / ~31-39g KH</span><b>${day.dayTotal}</b>`;
    ticket.appendChild(totalRow);
    root.appendChild(ticket);

    const liveNote = (viewIndex === dayIndex) ? " · Aktualisiert sich automatisch anhand des heutigen Datums" : "";
    root.appendChild(el("div","tp-footer", `Woche 8 · 17.08.–23.08.2026 · Jodiertes Salz für alle Rezepte verwenden (Jod-Lücke)${liveNote}`));
  }

  render();
})();
</script>
</body>
</html>
